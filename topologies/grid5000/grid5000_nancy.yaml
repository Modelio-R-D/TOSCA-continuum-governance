        gpu:
          count: 2
          model: Nvidia GeForce GTX 1080 Ti
          vendor: Nvidia
          architecture: Pascal
          vram_gib: 11.0
          vram_type: GDDR5X
          gpu_cores: 3584
          compute_capability: "6.1"
          consumer_grade: true
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_grele }

    # ── gres: 7 nodes, AMD EPYC 9254 Zen 4 + 2x L40S + 6.4 TB NVMe ────
    cluster_gres:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: gres
        access_condition: abaca
        oar_queue: abaca
        date_of_arrival: "2024-08-23"
        manufacturing_date: "2024-08-07"
        total_nodes: 7
        total_cores: 336
        max_walltime_hours: 168

    gres_nodes:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: gres
        node_range: "gres-[1-7]"
