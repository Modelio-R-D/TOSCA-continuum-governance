        manufacturing_date: "2023-11-30"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon Gold 6240L
          microarchitecture: Cascade Lake-SP
          num_cpus: 4
          cores_per_cpu: 18
          max_frequency_ghz: 2.60
        ram_gib: 6144.0
        # 6.0 TiB RAM: absolute record across all G5K sites in this survey.
        # For comparison: vianden (Luxembourg) has 2.0 TiB CPU + 1.5 TiB GPU.
        storage:
          - { label: disk0, capacity_tb: 1.6, type: SSD, interface: SAS, model: "HPE VO001600JWZJQ", primary: true }
          - { label: disk1, capacity_tb: 1.6, type: SSD, interface: SAS, model: "HPE VO001600JWZJQ" }
