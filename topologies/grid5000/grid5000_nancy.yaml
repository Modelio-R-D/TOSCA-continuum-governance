  # ───────────────────────────────────────────────────────────────────────────
  # GROUPS
  # ───────────────────────────────────────────────────────────────────────────
  groups:

    ultra_high_memory:
      type: tosca.groups.Root
      description: >
        Nodes with extraordinary RAM capacity.
        grosminet: 6.0 TiB (G5K survey record, 4-socket Cascade Lake).
        grostiti: 1.5 TiB (4-socket Haswell, 2015 hardware).
        grdix: 1.0 TiB (Zen 4c, 256 cores per node).
      members: [grosminet_node, grostiti_node, grdix_nodes]

    highest_core_count:
      type: tosca.groups.Root
      description: >
        AMD EPYC 9754 (Zen 4c) with 128 cores/socket = 256 cores/node.
        Highest single-node CPU core count in the 8-site G5K survey.
        Plus 200 Gbps InfiniBand HDR.
      members: [grdix_nodes]

    a100_nodes:
      type: tosca.groups.Root
      description: >
        Nodes with Nvidia A100 GPUs (Ampere, CC 8.0).
        grouille: 2x A100-PCIE-40GB (exotic, default queue).
        grat: 8x A100-SXM4-40GB (abaca queue, 30.72 TB SSD).
      members: [grouille_nodes, grat_node]

    consumer_gpu_nodes:
      type: tosca.groups.Root
      description: >
        Nodes with consumer/prosumer Nvidia GPUs (unusual in HPC context).
        graffiti: RTX 2080 Ti (Turing, CC 7.5, GeForce series).
        grele: GTX 1080 Ti (Pascal, CC 6.1, GeForce series).
        Supports CUDA but not certified for datacenter workloads.
      members: [graffiti_rtx2080ti, grele_nodes]

    infiniband_nodes:
      type: tosca.groups.Root
      description: InfiniBand HDR200 (200 Gbps) on grdix
      members: [grdix_nodes]

    omnipath_nodes:
      type: tosca.groups.Root
      description: >
        Omni-Path 100 Gbps fabric (grvingt). Note: OPA currently
        unsupported on Debian 12 environments.
      members: [grvingt_nodes]

    large_scale_default:
      type: tosca.groups.Root
      description: >
        Large node pools in the default queue (no exotic flag).
        gros: 123 nodes, single-socket Cascade Lake, 25 Gbps SR-IOV.
        Best choice for large-scale distributed experiments.
      members: [gros_main, gros_minor]

  outputs:

    site_summary:
      description: Grid'5000 Nancy site summary
      value:
        site:            { get_property: [site_nancy, site_name] }
        frontend:        { get_property: [site_nancy, frontend_hostname] }
        total_nodes:     { get_property: [site_nancy, total_nodes] }
        total_cpu_cores: { get_property: [site_nancy, total_cpu_cores] }
        total_gpu_count: { get_property: [site_nancy, total_gpu_count] }
        total_gpu_cores: { get_property: [site_nancy, total_gpu_cores] }
        total_ram_tib:   { get_property: [site_nancy, total_ram_tib] }
        tflops_cpu:      { get_property: [site_nancy, tflops_cpu] }

    gpu_verification:
      description: GPU count and core count verification
      value:
        grouille:  "4 GPUs x 6912 = 27648 cores"
        graffiti:  "48 GPUs (44x4352 + 4x4608) = 191488 + 18432 = 209920 cores"
        grat:      "8 GPUs x 6912 = 55296 cores"
        gratouille: "1 GPU x 5120 = 5120 cores"
        gres:      "14 GPUs x 18176 = 254464 cores"
        grue:      "20 GPUs x 2560 = 51200 cores"
        gruss:     "8 GPUs x 10752 = 86016 cores"
        grele:     "26 GPUs x 3584 = 93184 cores"
        total_gpus: 129
        total_cores: 782848
        status: "OK -- matches G5K reference API"

    records:
      description: Nancy records in the 8-site G5K survey
      value:
        largest_cluster:    "gros: 123 nodes (single cluster, default queue)"
        highest_cpu_cores:  "grdix: 256 cores/node (AMD EPYC 9754, Zen 4c)"
        highest_cpu_ram:    "grosminet: 6.0 TiB CPU RAM (4-socket Cascade Lake)"
        highest_tflops_cpu: "765.0 TFLOPS -- highest in 8-site survey"
        oldest_hardware:    "grostiti: manufactured 2015, arrived 2024 (9-year gap)"
