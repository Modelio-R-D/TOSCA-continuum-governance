            rate_gbps: 200.0
            type: InfiniBand
            model: Mellanox ConnectX-6 (HDR200)
            driver: mlx5_core
            available_for_experiment: true
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_grdix }

    # ── grele: 13 nodes, Broadwell + 2x GTX 1080 Ti, abaca ─────────────
    cluster_grele:
      type: g5k.nodes.Cluster
      properties:
