        total_cores: 64
        max_walltime_hours: 168

    grat_node:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: grat-1
        node_range: "grat-1"
        count: 1
        hw_model: HPE Apollo 6500
        manufacturing_date: "2022-06-22"
        cpu_info:
          architecture: x86_64
          model: AMD EPYC 7513
          microarchitecture: Zen 3
          num_cpus: 2
          cores_per_cpu: 32
          max_frequency_ghz: 2.60
        ram_gib: 512.0
        storage:
          - { label: disk0, capacity_tb: 3.84, type: SSD, interface: SAS, model: "HP VO003840RZWVA", primary: true }
          - { label: disk1, capacity_tb: 3.84, type: SSD, interface: SAS, model: "HP VO003840RZWVA" }
          - { label: disk2, capacity_tb: 3.84, type: SSD, interface: SAS, model: "HP VO003840RZWVA" }
          - { label: disk3, capacity_tb: 3.84, type: SSD, interface: SAS, model: "HP VO003840RZWVA" }
          - { label: disk4, capacity_tb: 3.84, type: SSD, interface: SAS, model: "HP VO003840RZWVA" }
          - { label: disk5, capacity_tb: 3.84, type: SSD, interface: SAS, model: "HP VO003840RZWVA" }
          - { label: disk6, capacity_tb: 3.84, type: SSD, interface: SAS, model: "HP VO003840RZWVA" }
          - { label: disk7, capacity_tb: 3.84, type: SSD, interface: SAS, model: "HP VO003840RZWVA" }
          # Total: 8 x 3.84 TB = 30.72 TB SSD
        network_interfaces:
          - { name: eth0/ens21f0np0, rate_gbps: 25.0, model: "Mellanox ConnectX-5", driver: mlx5_core, sriov_enabled: true, available_for_experiment: true }
