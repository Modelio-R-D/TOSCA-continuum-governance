        count: 11
        hw_model: Dell PowerEdge T640
        manufacturing_date: "2019-05-27"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon Silver 4110
          microarchitecture: Skylake-SP
          num_cpus: 2
          cores_per_cpu: 8
          max_frequency_ghz: 2.10
        ram_gib: 128.0
        storage:
          - { label: disk0, capacity_tb: 0.479, type: HDD, interface: SATA, model: "Dell PERC H330 Adp", primary: true }
        network_interfaces:
          - { name: eth2/ens4f0, rate_gbps: 10.0, model: "Intel X710", driver: i40e, available_for_experiment: true }
        gpu:
          count: 4
          model: Nvidia GeForce RTX 2080 Ti
          vendor: Nvidia
          architecture: Turing
          vram_gib: 11.0
          vram_type: GDDR6
          gpu_cores: 4352
          tensor_cores: 544
          compute_capability: "7.5"
          consumer_grade: true
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_graffiti }

    graffiti_qrtx6000:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: graffiti-13
        node_range: "graffiti-13"
        count: 1
        hw_model: Dell PowerEdge T640
        manufacturing_date: "2019-05-27"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon Silver 4110
          microarchitecture: Skylake-SP
          num_cpus: 2
          cores_per_cpu: 8
          max_frequency_ghz: 2.10
        ram_gib: 128.0
        storage:
          - { label: disk0, capacity_tb: 0.479, type: HDD, interface: SATA, model: "Dell PERC H330 Adp", primary: true }
        network_interfaces:
          - { name: eth2/ens4f0, rate_gbps: 10.0, model: "Intel X710", driver: i40e, available_for_experiment: true }
        gpu:
          count: 4
          model: Nvidia Quadro RTX 6000
          vendor: Nvidia
          architecture: Turing
          vram_gib: 23.0
          vram_type: GDDR6
          gpu_cores: 4608
          compute_capability: "7.5"
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_graffiti }

    # ── grappe: 16 nodes, Cascade Lake + 8 TB HDD, abaca ────────────────
    cluster_grappe:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: grappe
        access_condition: abaca
        oar_queue: abaca
        date_of_arrival: "2020-08-20"
        manufacturing_date: "2020-07-09"
        total_nodes: 16
        total_cores: 640
        max_walltime_hours: 168

    grappe_nodes:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: grappe
        node_range: "grappe-[1-16]"
        count: 16
        hw_model: Dell PowerEdge R640
        manufacturing_date: "2020-07-09"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon Gold 5218R
          microarchitecture: Cascade Lake-SP
          num_cpus: 2
          cores_per_cpu: 20
          max_frequency_ghz: 2.10
        ram_gib: 96.0
        storage:
          - { label: disk0, capacity_tb: 0.48, type: SSD, interface: SATA, model: "Intel SSDSC2KG480G8R", primary: true }
          - { label: disk1, capacity_tb: 8.0,  type: HDD, interface: SAS,  model: "Seagate ST8000NM0185" }
        network_interfaces:
          - { name: eth0/ens1f0, rate_gbps: 25.0, model: "Intel XXV710 25GbE SFP28", driver: i40e, available_for_experiment: true }
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_grappe }

    # ── grat: 1 node, AMD EPYC 7513 + 8x A100-SXM4 + 30 TB SSD, abaca ─
    cluster_grat:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: grat
