    # ── gratouille: 1 node, Broadwell + 1x V100-PCIE-16GB, abaca ────────
    cluster_gratouille:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: gratouille
        access_condition: abaca
        oar_queue: abaca
        date_of_arrival: "2017-06-26"
        manufacturing_date: "2017-06-07"
        total_nodes: 1
        total_cores: 24
        max_walltime_hours: 168

    gratouille_node:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: gratouille-1
        node_range: "gratouille-1"
        count: 1
        hw_model: Dell PowerEdge R730
        manufacturing_date: "2017-06-07"
        cpu_info:
