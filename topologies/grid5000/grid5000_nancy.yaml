tosca_definitions_version: tosca_simple_yaml_1_3

description: >
  TOSCA topology for the Grid'5000 Nancy site.
  Source: https://www.grid5000.fr/w/Nancy:Hardware
  Last API update: 2026-08-31 (commit 6c0c4bae22)
  Summary: 14 clusters, 264 nodes, 10470 CPU cores, 129 GPUs,
           782848 GPU cores, 57.28 TiB RAM, 524.6 TB storage,
           765.0 TFLOPS CPU (excl. GPUs).
  Two queues: default (2 clusters, 125 nodes) +
              abaca (12 clusters, 139 nodes, GPU/special hardware).
  Records in G5K survey:
    - gros: largest single cluster (123 nodes), default queue
    - grdix: highest CPU core count (256 cores/node, AMD EPYC 9754 Zen 4c)
    - grosminet: highest CPU RAM in G5K survey (6.0 TiB, 4-socket)
    - gres: L40S GPUs (Ada Lovelace, CC 8.9) in abaca
    - graffiti: consumer GPU (RTX 2080 Ti) in an HPC cluster
  Naming theme: all clusters start with "gr-" (Lorrain tradition)

metadata:
  template_name:    Grid5000-Nancy
  template_version: "1.0.0"
  template_author:  Generated from Grid5000 Reference API
  site:             Nancy
  source_url:       https://www.grid5000.fr/w/Nancy:Hardware
  created:          "2026-09-15"

data_types:

  g5k.datatypes.CPUInfo:
    derived_from: tosca.datatypes.Root
    properties:
      architecture:      { type: string, required: true }
      model:             { type: string, required: false }
      microarchitecture: { type: string, required: false }
      num_cpus:          { type: integer, required: true }
      cores_per_cpu:     { type: integer, required: true }
      max_frequency_ghz: { type: float, required: false }

  g5k.datatypes.StorageDisk:
    derived_from: tosca.datatypes.Root
    properties:
      label:       { type: string, required: true }
      capacity_tb: { type: float, required: true }
      type:        { type: string, required: true }
      interface:   { type: string, required: false }
      model:       { type: string, required: false }
      primary:     { type: boolean, default: false }
      reservable:  { type: boolean, default: false }

  g5k.datatypes.NetworkInterface:
    derived_from: tosca.datatypes.Root
    properties:
      name:                     { type: string, required: true }
      rate_gbps:                { type: float, required: true }
      model:                    { type: string, required: false }
      driver:                   { type: string, required: false }
      type:                     { type: string, default: Ethernet }
      sriov_enabled:            { type: boolean, default: false }
      rdma_capable:             { type: boolean, default: false }
      available_for_experiment: { type: boolean, default: true }

  g5k.datatypes.GPUInfo:
    derived_from: tosca.datatypes.Root
    properties:
      count:              { type: integer, required: true }
      model:              { type: string, required: true }
      vendor:             { type: string, required: false }
      architecture:       { type: string, required: false }
      vram_gib:           { type: float, required: true }
      vram_type:          { type: string, required: false }
      gpu_cores:          { type: integer, required: false }
      tensor_cores:       { type: integer, required: false }
      compute_capability: { type: string, required: false }
      consumer_grade:     { type: boolean, default: false }

node_types:

  g5k.nodes.Site:
    derived_from: tosca.nodes.Root
    properties:
      site_name:         { type: string, required: true }
      location:          { type: string, required: false }
      frontend_hostname: { type: string, required: false }
      total_nodes:       { type: integer, required: false }
      total_cpu_cores:   { type: integer, required: false }
      total_gpu_count:   { type: integer, default: 0 }
      total_gpu_cores:   { type: integer, default: 0 }
      total_ram_tib:     { type: float, required: false }
      total_storage_tb:  { type: float, required: false }
      tflops_cpu:        { type: float, required: false }

  g5k.nodes.Cluster:
    derived_from: tosca.nodes.Root
    properties:
      cluster_name:       { type: string, required: true }
      access_condition:   { type: string, default: default }
      oar_queue:          { type: string, default: default }
      date_of_arrival:    { type: string, required: false }
      manufacturing_date: { type: string, required: false }
      total_nodes:        { type: integer, required: false }
      total_cores:        { type: integer, required: false }
      max_walltime_hours: { type: integer, required: false }

  g5k.nodes.ComputeNode:
    derived_from: tosca.nodes.Compute
    properties:
      node_name:          { type: string, required: true }
      node_range:         { type: string, required: false }
      count:              { type: integer, required: true }
      hw_model:           { type: string, required: false }
      manufacturing_date: { type: string, required: false }
      cpu_info:           { type: g5k.datatypes.CPUInfo, required: true }
      ram_gib:            { type: float, required: true }
      storage:            { type: list, entry_schema: { type: g5k.datatypes.StorageDisk }, required: false }
      network_interfaces: { type: list, entry_schema: { type: g5k.datatypes.NetworkInterface }, required: false }
      gpu:                { type: g5k.datatypes.GPUInfo, required: false }
      supported_image_platforms: { type: list, entry_schema: { type: string }, required: false }

topology_template:

  node_templates:

    site_nancy:
      type: g5k.nodes.Site
      properties:
        site_name:         Nancy
        location:          Nancy, France
        frontend_hostname: fnancy
        total_nodes:       264
        total_cpu_cores:   10470
        total_gpu_count:   129
        total_gpu_cores:   782848
        total_ram_tib:     57.28
        total_storage_tb:  524.6
        tflops_cpu:        765.0

    # ═══════════════════════════════════════════════════════════════════════
    # DEFAULT QUEUE
    # ═══════════════════════════════════════════════════════════════════════

    # ── gros: 123 nodes, Cascade Lake single-socket, 25 Gbps SR-IOV ─────
    # Largest single cluster in the 8-site G5K survey.
    # Single-socket (1 CPU/node, 18 cores). All-SSD. 3 minor sub-groups
    # differing only in SSD model — condensed to 2 groups.
    cluster_gros:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: gros
        access_condition: default
        oar_queue: default
        date_of_arrival: "2019-09-04"
        manufacturing_date: "2019-07-16"
        total_nodes: 123
        total_cores: 2214

    gros_main:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: gros
        node_range: "gros-[1-26,28-67,69-102,104-124]"
        count: 121
        hw_model: Dell PowerEdge R640
        manufacturing_date: "2019-07-16"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon Gold 5220
          microarchitecture: Cascade Lake-SP
          num_cpus: 1
          cores_per_cpu: 18
          max_frequency_ghz: 2.20
        ram_gib: 96.0
        storage:
          - { label: disk0, capacity_tb: 0.48, type: SSD, interface: SATA, model: "Micron MTFDDAK480TDN", primary: true }
          - { label: disk1, capacity_tb: 0.96, type: SSD, interface: SATA, model: "Micron MTFDDAK960TDN", reservable: true }
        network_interfaces:
          - { name: eth0/eno1, rate_gbps: 25.0, model: "Mellanox ConnectX-4 Lx", driver: mlx5_core, sriov_enabled: true, available_for_experiment: true }
          - { name: eth1/eno2, rate_gbps: 25.0, model: "Mellanox ConnectX-4 Lx", driver: mlx5_core, sriov_enabled: true, available_for_experiment: true }
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_gros }

    # gros-27 (Samsung SSD) and gros-68 (Intel secondary SSD) are
    # functionally identical — merged for conciseness
    gros_minor:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: gros
        node_range: "gros-[27,68,103]"
        count: 2
        hw_model: Dell PowerEdge R640
        manufacturing_date: "2019-07-16"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon Gold 5220
          microarchitecture: Cascade Lake-SP
          num_cpus: 1
          cores_per_cpu: 18
          max_frequency_ghz: 2.20
        ram_gib: 96.0
        storage:
          - { label: disk0, capacity_tb: 0.48, type: SSD, interface: SATA, model: "Samsung/Micron (varies)", primary: true }
          - { label: disk1, capacity_tb: 0.96, type: SSD, interface: SATA, model: "Micron/Intel (varies)", reservable: true }
        network_interfaces:
          - { name: eth0/eno1, rate_gbps: 25.0, model: "Mellanox ConnectX-4 Lx", driver: mlx5_core, sriov_enabled: true, available_for_experiment: true }
          - { name: eth1/eno2, rate_gbps: 25.0, model: "Mellanox ConnectX-4 Lx", driver: mlx5_core, sriov_enabled: true, available_for_experiment: true }
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_gros }

    # ── grouille: 2 nodes, AMD EPYC 7452 + 2x A100-PCIE, exotic ────────
    cluster_grouille:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: grouille
        access_condition: exotic
        oar_queue: default
        date_of_arrival: "2021-01-13"
        manufacturing_date: "2020-12-07"
        total_nodes: 2
        total_cores: 128

    grouille_nodes:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: grouille
        node_range: "grouille-[1-2]"
        count: 2
        hw_model: Dell PowerEdge R7525
        manufacturing_date: "2020-12-07"
        cpu_info:
          architecture: x86_64
          model: AMD EPYC 7452
          microarchitecture: Zen 2
          num_cpus: 2
          cores_per_cpu: 32
          max_frequency_ghz: 2.35
        ram_gib: 128.0
        storage:
          - { label: disk0, capacity_tb: 1.92, type: SSD, interface: SAS,  model: "Toshiba KRM5XVUG1T92", primary: true }
          - { label: disk1, capacity_tb: 0.96, type: SSD, interface: SATA, model: "Micron MTFDDAK960TDT", reservable: true }
        network_interfaces:
          - { name: eth2/eno33, rate_gbps: 25.0, model: "Mellanox ConnectX-5", driver: mlx5_core, available_for_experiment: true }
        gpu:
          count: 2
          model: Nvidia A100-PCIE-40GB
          vendor: Nvidia
          architecture: Ampere
          vram_gib: 40.0
          vram_type: HBM2e
          gpu_cores: 6912
          tensor_cores: 432
          compute_capability: "8.0"
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_grouille }

    # ═══════════════════════════════════════════════════════════════════════
    # ABACA QUEUE
    # ═══════════════════════════════════════════════════════════════════════

    # ── graffiti: 12 nodes, Skylake-SP + consumer RTX GPUs, abaca ───────
    # Consumer-grade GPU (GeForce RTX 2080 Ti) in HPC context -- unusual.
    # graffiti-[1-11]: 4x RTX 2080 Ti; graffiti-13: 4x Quadro RTX 6000
    cluster_graffiti:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: graffiti
        access_condition: abaca
        oar_queue: abaca
        date_of_arrival: "2019-06-07"
        manufacturing_date: "2019-05-27"
        total_nodes: 12
        total_cores: 192
        max_walltime_hours: 168

    graffiti_rtx2080ti:
