    cluster_grosminet:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: grosminet
        access_condition: abaca
        oar_queue: abaca
        date_of_arrival: "2023-12-05"
        manufacturing_date: "2023-11-30"
        total_nodes: 1
        total_cores: 72
        max_walltime_hours: 24

    grosminet_node:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: grosminet-1
        node_range: "grosminet-1"
