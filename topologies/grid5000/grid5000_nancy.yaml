          - { label: disk4, capacity_tb: 1.6, type: SSD, interface: SAS, model: "HPE VO001600JWZJQ" }
          - { label: disk5, capacity_tb: 1.6, type: SSD, interface: SAS, model: "HPE VO001600JWZJQ" }
          - { label: disk6, capacity_tb: 1.6, type: SSD, interface: SAS, model: "HPE VO001600JWZJQ" }
          - { label: disk7, capacity_tb: 1.6, type: SSD, interface: SAS, model: "HPE VO001600JWZJQ" }
        network_interfaces:
          - { name: eth0/ens1f0, rate_gbps: 25.0, model: "Intel E810-XXV", driver: ice, sriov_enabled: true, available_for_experiment: true }
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_grosminet }

    # ── grostiti: 1 node, 4-socket Haswell, 1.5 TiB RAM, 2015 hardware ─
    # Manufactured 2015, arrived 2024 — 8-year gap (refurbished/relocated).
    cluster_grostiti:
