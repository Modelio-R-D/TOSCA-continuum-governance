    # ── grdix: 16 nodes, AMD EPYC 9754 Zen 4c + 200 Gbps IB, abaca ─────
    # 128 cores/socket = 256 cores/node — highest core count in G5K survey.
    # 1.0 TiB RAM + 200 Gbps InfiniBand (HDR).
    cluster_grdix:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: grdix
        access_condition: abaca
        oar_queue: abaca
        date_of_arrival: "2024-09-27"
        manufacturing_date: "2024-09-02"
