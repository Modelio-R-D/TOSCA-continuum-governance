  # ───────────────────────────────────────────────────────────────────────────
  # GROUPS
  # ───────────────────────────────────────────────────────────────────────────
  groups:

    maxwell_nodes:
      type: tosca.groups.Root
      description: >
        Nvidia Maxwell architecture (CC 5.2) -- oldest GPU in the survey.
        GTX TITAN X Maxwell (GM200): 3072 CUDA cores, 12 GiB GDDR5.
        CUDA support limited; not compatible with all modern frameworks.
      members: [esterel3_node, esterel4_node]

    h100_nodes:
      type: tosca.groups.Root
      description: >
        H100 NVL nodes: esterel42 (8x H100) + musa (6x2 H100).
        All PCIe-based H100 NVL: 14592 CUDA cores per GPU.
        Total H100 NVL at Sophia: 8 + 12 = 20 GPUs.
      members: [esterel42_node, musa_nodes]

    infiniband_200g_nodes:
      type: tosca.groups.Root
      description: >
        Nodes with 200 Gbps HDR InfiniBand -- only esterel44 and musa.
        Highest IB bandwidth at Sophia.
      members: [esterel44_node, musa_nodes]

    a100_nodes:
      type: tosca.groups.Root
      description: "Nvidia A100 nodes (40GB: esterel36; 80GB: esterel37, esterel38)"
      members: [esterel36_node, esterel37_node, esterel38_node]

    bulk_storage_node:
      type: tosca.groups.Root
      description: >
        mercantour7: AMD EPYC 7502 + 48.01 TB HDD -- largest bulk storage
        per node in the 8-site G5K survey. For large dataset experiments.
      members: [mercantour7_node]

    legacy_nodes:
      type: tosca.groups.Root
      description: >
        uvb (2011 Westmere): oldest hardware in the 8-site G5K survey.
        15 years of service. 1 Gbps + 40 Gbps InfiniBand.
        mercantour1 (2014), mercantour2 (2015): Ivy Bridge era.
      members: [uvb_nodes, mercantour1_nodes, mercantour2_nodes]

    mercantour_series:
      type: tosca.groups.Root
      description: >
        7 HPC compute clusters (no GPU), abaca queue.
        Named after Mercantour National Park.
        Spans 2014-2020 hardware. All have InfiniBand.
      members:
        - mercantour1_nodes
        - mercantour2_nodes
        - mercantour3_nodes
        - mercantour4_node
        - mercantour5_nodes
        - mercantour6_node
        - mercantour7_node

  # ───────────────────────────────────────────────────────────────────────────
  # OUTPUTS
  # ───────────────────────────────────────────────────────────────────────────
  outputs:

    site_summary:
      description: Grid'5000 Sophia site summary
      value:
        site:            { get_property: [site_sophia, site_name] }
        frontend:        { get_property: [site_sophia, frontend_hostname] }
        total_nodes:     { get_property: [site_sophia, total_nodes] }
        total_clusters:  51
        total_cpu_cores: { get_property: [site_sophia, total_cpu_cores] }
        total_gpu_count: { get_property: [site_sophia, total_gpu_count] }
        total_gpu_cores: { get_property: [site_sophia, total_gpu_cores] }
        total_ram_tib:   { get_property: [site_sophia, total_ram_tib] }
        tflops_cpu:      { get_property: [site_sophia, tflops_cpu] }

    highlights:
      description: Sophia highlights in the G5K survey
      value:
        most_clusters:  "51 clusters -- absolute record in G5K"
        oldest_hw:      "uvb (2011 Westmere) -- oldest in 8-site survey"
        oldest_gpu:     "esterel3-4: Maxwell GTX TITAN X (CC 5.2) -- oldest GPU"
        ib_universal:   "Every abaca cluster has InfiniBand (40/56/200 Gbps)"
        h100_cluster:   "esterel42: 8x H100 NVL + 2 TiB RAM + Xeon 6710E (Granite Rapids)"
        bulk_storage:   "mercantour7: 48 TB HDD -- most bulk storage per node"
        naming_beauty: >
          esterel = Massif de l'Esterel (volcanic maquis, Mediterranean herbes).
          mercantour = Mercantour National Park (Alpes-Maritimes, UNESCO).
          musa = genus Musa (banana plants, Mediterranean botanica).
          All names reflect the landscape of the Côte d'Azur.

    gpu_verification:
      description: GPU count and core count verification
      value:
        total_gpus:   218
        total_cores:  1357312
        key_values:
          maxwell_titan_x:   "4x3072 = 12288 (esterel3), 4x3072 = 12288 (esterel4)"
          h100_nlv_note:     "14592 cores/GPU (PCIe, 114 SMs) not 16896 (SXM5)"
          esterel42_h100:    "8 x 14592 = 116736"
          musa_h100:         "12 x 14592 = 175104"
        status: "OK -- verified against G5K reference API"
