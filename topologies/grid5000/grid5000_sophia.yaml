tosca_definitions_version: tosca_simple_yaml_1_3

description: >
  TOSCA topology for the Grid'5000 Sophia Antipolis site.
  Source: https://www.grid5000.fr/w/Sophia:Hardware
  Summary: 51 clusters, 114 nodes, 3180 CPU cores, 218 GPUs,
           1357312 GPU cores, 31.78 TiB RAM, 364.02 TB storage,
           172.9 TFLOPS CPU (excl. GPUs).
  Two queues: default (1 cluster: uvb, 4 nodes) +
              abaca (50 clusters, 110 nodes).
  Naming themes:
    - "esterel" series: Massif de l'Esterel (volcanic red rocks,
      Mediterranean maquis, les herbes aromatiques!) near Cannes/Frejus
    - "mercantour" series: Mercantour National Park (Alpes-Maritimes)
    - "musa": genus of banana plants / Mediterranean botanica
    - "uvb": legacy acronym (oldest cluster, 2011 Westmere)
  Records in G5K survey:
    - 51 clusters: ABSOLUTE RECORD across all 12 G5K sites
    - uvb (2011): oldest hardware in our 8-site survey (Westmere CPUs)
    - esterel3-4: Maxwell GTX TITAN X (CC 5.2) -- oldest GPU in survey
    - esterel42: 8x H100 NVL + Intel Xeon 6710E + 2.0 TiB RAM
    - mercantour7: ~48 TB HDD -- most bulk storage per node in survey
    - Universal InfiniBand: every abaca node has at least 40 Gbps IB
    - GPU diversity: Pascal/Maxwell/Turing/Volta/Ampere/Ada/Hopper

metadata:
  template_name:    Grid5000-Sophia
  template_version: "1.0.0"
  template_author:  Generated from Grid5000 Reference API
  site:             Sophia
  source_url:       https://www.grid5000.fr/w/Sophia:Hardware
  created:          "2026-09-15"

data_types:

  g5k.datatypes.CPUInfo:
    derived_from: tosca.datatypes.Root
    properties:
      architecture:      { type: string, required: true }
      model:             { type: string, required: false }
      microarchitecture: { type: string, required: false }
      num_cpus:          { type: integer, required: true }
      cores_per_cpu:     { type: integer, required: true }
      max_frequency_ghz: { type: float, required: false }

  g5k.datatypes.StorageDisk:
    derived_from: tosca.datatypes.Root
    properties:
      label:       { type: string, required: true }
      capacity_tb: { type: float, required: true }
      type:        { type: string, required: true }
      interface:   { type: string, required: false }
      model:       { type: string, required: false }
      primary:     { type: boolean, default: false }

  g5k.datatypes.NetworkInterface:
    derived_from: tosca.datatypes.Root
    properties:
      name:                     { type: string, required: true }
      rate_gbps:                { type: float, required: true }
      type:                     { type: string, default: Ethernet }
      model:                    { type: string, required: false }
      driver:                   { type: string, required: false }
      sriov_enabled:            { type: boolean, default: false }
      available_for_experiment: { type: boolean, default: true }

  g5k.datatypes.GPUInfo:
    derived_from: tosca.datatypes.Root
    properties:
      count:              { type: integer, required: true }
      model:              { type: string, required: true }
      vendor:             { type: string, required: false }
      architecture:       { type: string, required: false }
      vram_gib:           { type: float, required: true }
      gpu_cores:          { type: integer, required: false }
      compute_capability: { type: string, required: false }

node_types:

  g5k.nodes.Site:
    derived_from: tosca.nodes.Root
    properties:
      site_name:         { type: string, required: true }
      location:          { type: string, required: false }
      frontend_hostname: { type: string, required: false }
      total_nodes:       { type: integer, required: false }
      total_cpu_cores:   { type: integer, required: false }
      total_gpu_count:   { type: integer, default: 0 }
      total_gpu_cores:   { type: integer, default: 0 }
      total_ram_tib:     { type: float, required: false }
      total_storage_tb:  { type: float, required: false }
      tflops_cpu:        { type: float, required: false }

  g5k.nodes.Cluster:
    derived_from: tosca.nodes.Root
    properties:
      cluster_name:       { type: string, required: true }
      access_condition:   { type: string, default: default }
      oar_queue:          { type: string, default: default }
      date_of_arrival:    { type: string, required: false }
      manufacturing_date: { type: string, required: false }
      total_nodes:        { type: integer, required: false }
      max_walltime_hours: { type: integer, required: false }

  g5k.nodes.ComputeNode:
    derived_from: tosca.nodes.Compute
    properties:
      node_name:          { type: string, required: true }
      node_range:         { type: string, required: false }
      count:              { type: integer, required: true }
      hw_model:           { type: string, required: false }
      manufacturing_date: { type: string, required: false }
      cpu_info:           { type: g5k.datatypes.CPUInfo, required: true }
      ram_gib:            { type: float, required: true }
      storage:            { type: list, entry_schema: { type: g5k.datatypes.StorageDisk }, required: false }
      network_interfaces: { type: list, entry_schema: { type: g5k.datatypes.NetworkInterface }, required: false }
      gpu:                { type: g5k.datatypes.GPUInfo, required: false }
      supported_image_platforms: { type: list, entry_schema: { type: string }, required: false }

topology_template:

  node_templates:

    site_sophia:
      type: g5k.nodes.Site
      properties:
        site_name:         Sophia
        location:          Sophia Antipolis, France
        frontend_hostname: fsophia
        total_nodes:       114
        total_cpu_cores:   3180
        total_gpu_count:   218
        total_gpu_cores:   1357312
        total_ram_tib:     31.78
        total_storage_tb:  364.02
        tflops_cpu:        172.9

    # ═══════════════════════════════════════════════════════════════════════
    # DEFAULT QUEUE: uvb (4 nodes, 2011 Westmere -- oldest in survey)
    # ═══════════════════════════════════════════════════════════════════════
    cluster_uvb:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: uvb
        access_condition: default
        oar_queue: default
        date_of_arrival: "2011-01-04"
        manufacturing_date: "2011-01-04"
        total_nodes: 4

    uvb_nodes:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: uvb
        node_range: "uvb-[1-4]"
        count: 4
        hw_model: Dell PowerEdge C6100
        manufacturing_date: "2011-01-04"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon X5670
          microarchitecture: Westmere
          num_cpus: 2
          cores_per_cpu: 6
          max_frequency_ghz: 2.93
          # Westmere (2010): 32nm, 6-core Nehalem successor.
          # Still running in 2026 -- 15 years of service.
        ram_gib: 96.0
        storage:
          - { label: disk0, capacity_tb: 0.25, type: HDD, interface: SATA, model: "WDC WD2502ABYS-1", primary: true }
        network_interfaces:
          - { name: eth0/eno1, rate_gbps: 1.0, model: "Intel 82576", driver: igb, sriov_enabled: true, available_for_experiment: true }
          - { name: ib0, rate_gbps: 40.0, type: InfiniBand, model: "Mellanox MT25408A0 ConnectX", driver: mlx4_core, available_for_experiment: true }
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_uvb }

    # ═══════════════════════════════════════════════════════════════════════
    # ABACA QUEUE: esterel series (single-node GPU workstations)
    # All have InfiniBand (40 or 56 Gbps). Network: 1 Gbps Ethernet + IB.
    # ═══════════════════════════════════════════════════════════════════════

