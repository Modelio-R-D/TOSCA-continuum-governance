      properties:
        site_name:         Rennes
        location:          "Rennes, France"
        frontend_hostname: frennes
        total_nodes:       173
        total_cpu_cores:   6420
        total_gpu_count:   96
        total_gpu_cores:   718592
        total_ram_tib:     53.94
        total_storage_tb:  493.0
        tflops_cpu:        412.0

