          - { label: disk1, capacity_tb: 1.92, type: SSD, interface: SATA, model: "HP MK001920GZXRC" }
        network_interfaces:
          - { name: eth0/ens10f0np0, rate_gbps: 25.0, model: "Broadcom BCM57414 RDMA", driver: bnxt_en, available_for_experiment: true }
