  # ───────────────────────────────────────────────────────────────────────────
  # GROUPS
  # ───────────────────────────────────────────────────────────────────────────
  groups:

    h100_nodes:
      type: tosca.groups.Root
      description: >
        H100 NVL (PCIe-based, 94 GiB HBM3, 14592 CUDA cores).
        Note: H100 NVL is PCIe-based (114 SMs) not SXM5 (132 SMs).
      members: [abacus27_node]

    zen5_nodes:
      type: tosca.groups.Root
      description: >
        AMD EPYC 9135 Zen 5 (abacus29) -- first Zen 5 in the 8-site survey.
        Zen 5: wider decode front-end, improved AVX-512 throughput,
        new branch predictor. Turin family (2025).
      members: [abacus29_node]

    v100_nodes:
      type: tosca.groups.Root
      description: Nodes with Nvidia V100 GPUs (Volta, CC 7.0)
      members: [abacus9_node, abacus12_node, abacus14_node, abacus16_node, abacus28_node, abacus30_nodes]

    a100_nodes:
      type: tosca.groups.Root
      description: Nodes with Nvidia A100 GPUs (Ampere, CC 8.0)
      members: [abacus21_node]

    a40_nodes:
      type: tosca.groups.Root
      description: Nodes with Nvidia A40 GPUs (Ampere, CC 8.6)
      members: [abacus4_node, abacus22_3gpu, abacus22_1gpu, abacus25_nodes]

    l40s_nodes:
      type: tosca.groups.Root
      description: Nodes with Nvidia L40S (Ada Lovelace, CC 8.9)
      members: [abacus26_node, abacus29_node]

    roazhon_series:
      type: tosca.groups.Root
      description: >
        "Roazhon" = Rennes in Breton (Gallo language).
        15 compute clusters (no GPU), abaca queue.
        Spans 2012-2025 hardware. Includes roazhon4 (AMD EPYC 7H12,
        128 cores) and roazhon15 (EPYC 9555 Genoa, 128 cores, 1.5 TiB RAM).
      members:
        - roazhon1_node
        - roazhon2_node
        - roazhon3_node
        - roazhon4_node
        - roazhon5_nodes
        - roazhon6_nodes
        - roazhon7_nodes
        - roazhon8_nodes
        - roazhon9_nodes
        - roazhon10_nodes
        - roazhon11_nodes
        - roazhon12_nodes
        - roazhon13_nodes
        - roazhon14_nodes
        - roazhon15_node

    default_queue_nodes:
      type: tosca.groups.Root
      description: "Default queue (no restrictions): paradoxe + parasilo (89 nodes)"
      members: [paradoxe_group_a, paradoxe_group_b, parasilo_main]

  outputs:

    site_summary:
      description: Grid'5000 Rennes site summary
      value:
        site:              { get_property: [site_rennes, site_name] }
        frontend:          { get_property: [site_rennes, frontend_hostname] }
        total_nodes:       { get_property: [site_rennes, total_nodes] }
        total_clusters:    41
        total_cpu_cores:   { get_property: [site_rennes, total_cpu_cores] }
        total_gpu_count:   { get_property: [site_rennes, total_gpu_count] }
        total_gpu_cores:   { get_property: [site_rennes, total_gpu_cores] }
        total_ram_tib:     { get_property: [site_rennes, total_ram_tib] }
        tflops_cpu:        { get_property: [site_rennes, tflops_cpu] }

    highlights:
      description: Rennes highlights in the 8-site survey
      value:
        most_clusters:     "41 clusters -- record in G5K 8-site survey"
        zen5_first:        "abacus29: AMD EPYC 9135 Zen 5 -- first Zen 5 in survey"
        breton_identity:   "roazhon series named after Breton word for Rennes"
        unix_epoch_node:   "abacus30: manufacturing_date=1970-01-01 (Unix epoch placeholder)"
        roazhon15:         "EPYC 9555 Genoa (128 cores, 1.5 TiB RAM, 6.4 TB NVMe)"
        gpu_core_note: >
          H100 NVL (abacus27): 14592 cores/GPU (PCIe, 114 SMs),
          NOT 16896 (SXM5, 132 SMs). Verified against G5K total 718592.

    gpu_verification:
      description: GPU count verification
      value:
        total_gpus:   96
        total_cores:  718592
        h100_nlv_note: "4 x 14592 = 58368 (PCIe variant, not SXM5)"
        status:       "OK -- verified against G5K reference API"
