  # ───────────────────────────────────────────────────────────────────────────
  # GROUPS
  # ───────────────────────────────────────────────────────────────────────────
  groups:

    ppc64le_nodes:
      type: tosca.groups.Root
      description: >
        IBM POWER8NVL nodes (drac) — the ONLY ppc64le cluster in G5K.
        Requires linux/ppc64le container images (very limited registry coverage).
        P100 GPUs connected via NVLink (not PCIe) to POWER8NVL CPU.
        Extends the ISA taxonomy beyond Tier1/Tier2: Tier1-ppc64le.
      members: [drac_nodes]

    aarch64_nodes:
      type: tosca.groups.Root
      description: >
        Ampere Altra (Neoverse-N1) nodes — server-class AArch64,
        80 cores, 1 TiB RAM. linux/arm64 images required.
      members: [sasquatch_nodes]

    fpga_nodes:
      type: tosca.groups.Root
      description: >
        Xilinx Alveo U200 FPGA (servan) — research-grade datacenter FPGA.
        2x 100 Gbps FPGA/Ethernet ports for FPGA-accelerated networking.
        Unlike embedded SoC FPGAs (Pynq, ZCU102), this is a PCIe card
        in a standard x86_64 server.
      members: [servan_nodes]

    pmem_nodes:
      type: tosca.groups.Root
      description: >
        Nodes with Intel Optane Persistent Memory (DCPMM).
        384 GiB DRAM + 1.5 TiB PMEM = 1.875 TiB total per node.
        Supports App Direct mode (NVDIMM) or Memory mode (volatile extension).
      members: [troll_nodes]

    default_queue_nodes:
      type: tosca.groups.Root
      description: Clusters in the default OAR queue
      members: [dahu_group_opa, dahu_node_2, dahu_group_noopa]

    abaca_queue_nodes:
      type: tosca.groups.Root
      description: GPU workstation clusters in the abaca queue (max 168h)
      members:
        - chartreuse2_nodes
        - chartreuse3_nodes
        - chartreuse4_nodes
        - chartreuse6_nodes
        - chartreuse7_node
        - kinovis_nodes
        - vercors2_nodes
        - vercors3_nodes
        - vercors4_nodes
        - vercors5_node
        - vercors7_nodes
        - vercors8_nodes
        - vercors9_nodes
        - vercors10_nodes
        - vercors11_node
        - vercors12_nodes
        - vercors13_node
        - vercors14_nodes
        - vercors16_node
        - vercors17_node
        - vercors18_nodes

    blackwell_nodes:
      type: tosca.groups.Root
      description: >
        Nvidia Blackwell GPU nodes (vercors18, 2025/2026).
        RTX PRO 6000: 96 GiB GDDR7, CC 10.0 -- newest GPU architecture in G5K.
      members: [vercors18_nodes]

    ada_lovelace_nodes:
      type: tosca.groups.Root
      description: "Nvidia Ada Lovelace GPU nodes (CC 8.9): L40S, L4, RTX 6000 Ada"
      members: [kinovis_nodes, vercors14_nodes, vercors16_node, vercors17_node]

    high_memory_gpu_nodes:
      type: tosca.groups.Root
      description: Nodes with >= 45 GiB VRAM per GPU
      members:
        - vercors5_node     # 4x Quadro RTX 8000 (45 GiB)
        - vercors8_nodes    # 2x Quadro RTX 8000 (45 GiB)
        - vercors11_node    # 2x Quadro RTX 8000 (45 GiB)
        - vercors13_node    # 2x A6000 (48 GiB)
        - vercors14_nodes   # 2x RTX 6000 Ada (48 GiB)
        - kinovis_nodes     # 2x L40S (45 GiB)
        - vercors17_node    # 4x L40S (45 GiB)
        - vercors18_nodes   # 2x RTX PRO 6000 (96 GiB)

  outputs:

    site_summary:
      description: Grid'5000 Grenoble site summary
      value:
        site:            { get_property: [site_grenoble, site_name] }
        frontend:        { get_property: [site_grenoble, frontend_hostname] }
        total_nodes:     { get_property: [site_grenoble, total_nodes] }
        total_cpu_cores: { get_property: [site_grenoble, total_cpu_cores] }
        total_gpu_count: { get_property: [site_grenoble, total_gpu_count] }
        total_gpu_cores: { get_property: [site_grenoble, total_gpu_cores] }
        total_ram_tib:   { get_property: [site_grenoble, total_ram_tib] }
        total_pmem_tib:  { get_property: [site_grenoble, total_pmem_tib] }
        isa_diversity:   { get_property: [site_grenoble, isa_diversity] }
        queue_types:     { get_property: [site_grenoble, queue_types] }

    unique_features:
      description: What makes Grenoble unique in the G5K survey
      value:
        ppc64le_cluster: >
          drac: IBM POWER8NVL with P100 GPUs via NVLink -- the ONLY ppc64le
          cluster in the entire G5K infrastructure. Requires linux/ppc64le
          container images. Extends the ISA taxonomy to three server-class
          architectures: x86_64, aarch64, ppc64le.
        pmem_cluster: >
          troll: Intel Optane Persistent Memory (1.5 TiB/node) -- byte-
          addressable NVDIMM on the memory bus. Unique in the G5K survey.
        fpga_cluster: >
          servan: Xilinx Alveo U200 with 2x 100 Gbps FPGA/Ethernet ports --
          research-grade PCIe FPGA (vs. embedded Zynq SoC in testbed).
        gpu_zoo: >
          15+ distinct GPU models spanning Pascal (2016) to Blackwell RTX PRO
          6000 (2026). No other G5K site covers such a complete GPU generation
          timeline. Useful for GPU architecture research and benchmarking
          across CUDA compute capabilities 6.0 through 10.0.
        blackwell_first: >
          vercors18: Nvidia RTX PRO 6000 (Blackwell, CC 10.0, 96 GiB GDDR7)
          -- among the first Blackwell GPUs available in any HPC testbed.
