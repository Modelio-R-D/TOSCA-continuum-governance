tosca_definitions_version: tosca_simple_yaml_1_3

description: >
  TOSCA topology for the Grid'5000 Grenoble site.
  Source: https://www.grid5000.fr/w/Grenoble:Hardware
  Summary: 27 clusters, 110 nodes, 3564 CPU cores, 126 GPUs,
           1089536 GPU cores, 23.25 TiB RAM + 6.0 TiB PMEM,
           710.1 TB storage, 219.2 TFLOPS CPU (excl. GPUs).
  Two queues: default (6 clusters, 51 nodes) +
              abaca (21 clusters, 59 nodes, GPU workstations).
  Architectural highlights:
    - THREE ISA tiers: x86_64, AArch64 (sasquatch/Neoverse-N1),
      ppc64le (drac/IBM POWER8NVL) -- unique in G5K survey
    - FPGA: Xilinx Alveo U200 (servan) -- research-grade FPGA
    - PMEM: 1.5 TiB Persistent Memory per node (troll)
    - GPU zoo: 15+ distinct GPU models from Pascal (2016) to
      Blackwell RTX PRO 6000 (2026, vercors18)
    - ppc64le is not in Tier 1/2/3 ISA taxonomy -- extends it to Tier1-ppc64le

metadata:
  template_name:    Grid5000-Grenoble
  template_version: "1.0.0"
  template_author:  Generated from Grid5000 Reference API
  site:             Grenoble
  source_url:       https://www.grid5000.fr/w/Grenoble:Hardware
  created:          "2026-09-15"

data_types:

  g5k.datatypes.CPUInfo:
    derived_from: tosca.datatypes.Root
    properties:
      architecture:      { type: string, required: true }
      model:             { type: string, required: false }
      microarchitecture: { type: string, required: false }
      num_cpus:          { type: integer, required: true }
      cores_per_cpu:     { type: integer, required: true }
      max_frequency_ghz: { type: float, required: false }
      oci_coverage:
        type: string
        description: >
          OCI/Docker registry coverage for this ISA platform.
          Architecturally independent of the ISA tier -- ppc64le is
          Tier1 but has limited public image availability.
        default: universal
        constraints:
          - valid_values: [universal, broad, limited]
        # universal : linux/amd64   -- almost all public images
        # broad     : linux/arm64   -- major images (Graviton, Apple)
        # limited   : linux/ppc64le, linux/arm/v7 -- IBM + community only

  g5k.datatypes.StorageDisk:
    derived_from: tosca.datatypes.Root
    properties:
      label:       { type: string, required: true }
      capacity_tb: { type: float, required: true }
      type:        { type: string, required: true }
      interface:   { type: string, required: false }
      model:       { type: string, required: false }
      primary:     { type: boolean, default: false }
      reservable:  { type: boolean, default: false }

  g5k.datatypes.NetworkInterface:
    derived_from: tosca.datatypes.Root
    properties:
      name:                     { type: string, required: true }
      rate_gbps:                { type: float, required: true }
      model:                    { type: string, required: false }
      driver:                   { type: string, required: false }
      type:                     { type: string, default: Ethernet }
      sriov_enabled:            { type: boolean, default: false }
      available_for_experiment: { type: boolean, default: true }

  g5k.datatypes.GPUInfo:
    derived_from: tosca.datatypes.Root
    properties:
      count:              { type: integer, required: true }
      model:              { type: string, required: true }
      vendor:             { type: string, required: false }
      architecture:       { type: string, required: false }
      vram_gib:           { type: float, required: true }
      vram_type:          { type: string, required: false }
      gpu_cores:          { type: integer, required: false }
      compute_capability: { type: string, required: false }

  g5k.datatypes.FPGAInfo:
    derived_from: tosca.datatypes.Root
    properties:
      model:       { type: string, required: true }
      vendor:      { type: string, required: false }
      shell:       { type: string, required: false }
      link_gbps:   { type: float, required: false }
      count:       { type: integer, default: 1 }

  g5k.datatypes.PMEMInfo:
    derived_from: tosca.datatypes.Root
    properties:
      capacity_tib:  { type: float, required: true }
      model:         { type: string, required: false }
      per_node_tib:  { type: float, required: false }
      description: >
        Persistent Memory (PMEM/DCPMM) — byte-addressable non-volatile
        memory on the memory bus. Accessible as DAX-mode FS or as a
        volatile memory extension. Survives reboots in App Direct mode.

node_types:

  g5k.nodes.Site:
    derived_from: tosca.nodes.Root
    properties:
      site_name:         { type: string, required: true }
      location:          { type: string, required: false }
      frontend_hostname: { type: string, required: false }
      total_nodes:       { type: integer, required: false }
      total_cpu_cores:   { type: integer, required: false }
      total_gpu_count:   { type: integer, default: 0 }
      total_gpu_cores:   { type: integer, default: 0 }
      total_ram_tib:     { type: float, required: false }
      total_pmem_tib:    { type: float, default: 0.0 }
      total_storage_tb:  { type: float, required: false }
      tflops_cpu:        { type: float, required: false }
      isa_diversity:     { type: list, entry_schema: { type: string }, required: false }
      queue_types:       { type: list, entry_schema: { type: string }, required: false }

  g5k.nodes.Cluster:
    derived_from: tosca.nodes.Root
    properties:
      cluster_name:       { type: string, required: true }
      access_condition:   { type: string, default: default }
      oar_queue:          { type: string, default: default }
      date_of_arrival:    { type: string, required: false }
      manufacturing_date: { type: string, required: false }
      total_nodes:        { type: integer, required: false }
      total_cores:        { type: integer, required: false }
      isa_tier:           { type: string, required: false }
      max_walltime_hours: { type: integer, required: false }

  g5k.nodes.ComputeNode:
    derived_from: tosca.nodes.Compute
    properties:
      node_name:          { type: string, required: true }
      node_range:         { type: string, required: false }
      count:              { type: integer, required: true }
      hw_model:           { type: string, required: false }
      manufacturing_date: { type: string, required: false }
      cpu_info:           { type: g5k.datatypes.CPUInfo, required: true }
      ram_gib:            { type: float, required: true }
      pmem:               { type: g5k.datatypes.PMEMInfo, required: false }
      storage:            { type: list, entry_schema: { type: g5k.datatypes.StorageDisk }, required: false }
      network_interfaces: { type: list, entry_schema: { type: g5k.datatypes.NetworkInterface }, required: false }
      gpu:                { type: g5k.datatypes.GPUInfo, required: false }
      fpga:               { type: g5k.datatypes.FPGAInfo, required: false }
      supported_image_platforms: { type: list, entry_schema: { type: string }, required: false }

topology_template:

  node_templates:

    # ═══════════════════════════════════════════════════════════════════════
    # SITE
    # ═══════════════════════════════════════════════════════════════════════
    site_grenoble:
      type: g5k.nodes.Site
      properties:
        site_name:         Grenoble
        location:          Grenoble, France
        frontend_hostname: fgrenoble
        total_nodes:       110
        total_cpu_cores:   3564
        total_gpu_count:   126
        total_gpu_cores:   1089536
        total_ram_tib:     23.25
        total_pmem_tib:    6.0
        total_storage_tb:  710.1
        tflops_cpu:        219.2
        isa_diversity:
          - Tier1-x86_64          # majority of clusters
          - Tier1-aarch64         # sasquatch (Ampere Neoverse-N1)
          - Tier1-ppc64le         # drac (IBM POWER8NVL) — unique in G5K
        queue_types:
          - default               # 6 clusters, standard reservations
          - abaca                 # 21 clusters, GPU workstations, max 168h

    # ═══════════════════════════════════════════════════════════════════════
    # DEFAULT QUEUE CLUSTERS
    # ═══════════════════════════════════════════════════════════════════════

    # ── dahu: 31 nodes, Skylake-SP, Omni-Path, default ──────────────────
    # 3 sub-groups (NIC/storage differences)
    cluster_dahu:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: dahu
        access_condition: default
        oar_queue: default
        date_of_arrival: "2018-03-22"
        manufacturing_date: "2017-12-12"
        total_nodes: 31
        total_cores: 992
        isa_tier: Tier1-x86_64

    # dahu-[1,4-17,19-25,27-29,31-32]: 27 nodes, 10G + 100G Omni-Path, Seagate HDD
    dahu_group_opa:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: dahu
        node_range: "dahu-[1,4-17,19-25,27-29,31-32]"
        count: 27
        hw_model: Dell PowerEdge C6420
        manufacturing_date: "2017-12-12"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon Gold 6130
          microarchitecture: Skylake-SP
          num_cpus: 2
          cores_per_cpu: 16
          max_frequency_ghz: 2.10
        ram_gib: 192.0
        storage:
          - { label: disk0, capacity_tb: 0.24,  type: SSD, interface: SATA, model: "Samsung MZ7KM240HMHQ0D3", primary: true }
          - { label: disk1, capacity_tb: 0.48,  type: SSD, interface: SATA, model: "Samsung MZ7KM480HMHQ0D3" }
          - { label: disk2, capacity_tb: 4.0,   type: HDD, interface: SATA, model: "Seagate ST4000NM0265-2DC" }
        network_interfaces:
          - { name: eth0/enp24s0f0, rate_gbps: 10.0, model: "Intel X710 10GbE SFP+", driver: i40e, available_for_experiment: true }
          - { name: ib0, rate_gbps: 100.0, type: OmniPath, model: "Intel OPA HFI Silicon 100", driver: hfi1, available_for_experiment: true }
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_dahu }

    # dahu-2: 1 node, same but Toshiba HDD
    dahu_node_2:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: dahu-2
        node_range: "dahu-2"
        count: 1
        hw_model: Dell PowerEdge C6420
        manufacturing_date: "2017-12-12"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon Gold 6130
          microarchitecture: Skylake-SP
          num_cpus: 2
          cores_per_cpu: 16
          max_frequency_ghz: 2.10
        ram_gib: 192.0
        storage:
          - { label: disk0, capacity_tb: 0.24, type: SSD, interface: SATA, model: "Samsung MZ7KM240HMHQ0D3", primary: true }
          - { label: disk1, capacity_tb: 0.48, type: SSD, interface: SATA, model: "Samsung MZ7KM480HMHQ0D3" }
          - { label: disk2, capacity_tb: 4.0,  type: HDD, interface: SATA, model: "Toshiba TOSHIBA MG08ADA4" }
        network_interfaces:
          - { name: eth0/enp24s0f0, rate_gbps: 10.0, model: "Intel X710", driver: i40e, available_for_experiment: true }
          - { name: ib0, rate_gbps: 100.0, type: OmniPath, model: "Intel OPA HFI Silicon 100", driver: hfi1, available_for_experiment: true }
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_dahu }

    # dahu-[18,26,30]: 3 nodes, 10G only (no Omni-Path)
    dahu_group_noopa:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: dahu
        node_range: "dahu-[18,26,30]"
        count: 3
        hw_model: Dell PowerEdge C6420
        manufacturing_date: "2017-12-12"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon Gold 6130
          microarchitecture: Skylake-SP
          num_cpus: 2
          cores_per_cpu: 16
          max_frequency_ghz: 2.10
        ram_gib: 192.0
        storage:
          - { label: disk0, capacity_tb: 0.24, type: SSD, interface: SATA, model: "Samsung MZ7KM240HMHQ0D3", primary: true }
          - { label: disk1, capacity_tb: 0.48, type: SSD, interface: SATA, model: "Samsung MZ7KM480HMHQ0D3" }
          - { label: disk2, capacity_tb: 4.0,  type: HDD, interface: SATA, model: "Seagate ST4000NM0265-2DC" }
        network_interfaces:
          - { name: eth0/enp24s0f0, rate_gbps: 10.0, model: "Intel X710", driver: i40e, available_for_experiment: true }
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_dahu }

    # ── drac: 8 nodes, IBM POWER8NVL (ppc64le!), 4x P100, exotic ───────
    # UNIQUE in all G5K sites: ppc64le ISA — neither x86_64 nor AArch64.
    # Extends the ISA taxonomy with Tier1-ppc64le.
    cluster_drac:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: drac
        access_condition: exotic
        oar_queue: default
        date_of_arrival: "2020-10-05"
        manufacturing_date: "2016-10-17"
        total_nodes: 8
        total_cores: 160
        isa_tier: Tier1-ppc64le

    drac_nodes:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: drac
        node_range: "drac-[1-8]"
        count: 8
        hw_model: IBM PowerNV S822LC (8335-GTB)
        manufacturing_date: "2016-10-17"
        cpu_info:
          architecture: ppc64le
          oci_coverage: limited
          model: IBM POWER8NVL 1.0
          microarchitecture: POWER8
          num_cpus: 2
          cores_per_cpu: 10
          max_frequency_ghz: 4.0
          # POWER8NVL: NVLink-enabled variant — P100 GPUs connected via NVLink
          # ppc64le: little-endian POWER, OCI platform linux/ppc64le
        ram_gib: 128.0
        storage:
          - { label: disk0, capacity_tb: 1.0, type: HDD, interface: SATA, model: "Seagate ST1000NX0313", primary: true }
          - { label: disk1, capacity_tb: 1.0, type: HDD, interface: SATA, model: "Seagate ST1000NX0313" }
        network_interfaces:
          - { name: eth0/enP1p1s0f0, rate_gbps: 10.0, model: "Broadcom BCM57800", driver: bnx2x, available_for_experiment: true }
          - { name: ib0, rate_gbps: 100.0, type: InfiniBand, model: "Mellanox ConnectX-4", driver: mlx5_core, available_for_experiment: true }
          - { name: ib1, rate_gbps: 100.0, type: InfiniBand, model: "Mellanox ConnectX-4", driver: mlx5_core, available_for_experiment: true }
        gpu:
          count: 4
          model: Nvidia Tesla P100-SXM2-16GB
          vendor: Nvidia
          architecture: Pascal
          vram_gib: 16.0
          vram_type: HBM2
          gpu_cores: 3584
          compute_capability: "6.0"
          # Connected via NVLink to POWER8NVL CPU (not PCIe)
          # OCI: linux/ppc64le images required — very limited registry coverage
        supported_image_platforms: [linux/ppc64le]
      requirements:
        - host: { node: cluster_drac }

    # ── sasquatch: 2 nodes, Ampere Neoverse-N1, AArch64, 1 TiB, exotic ─
    cluster_sasquatch:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: sasquatch
        access_condition: exotic
        oar_queue: default
        date_of_arrival: "2025-11-17"
        manufacturing_date: "2025-07-18"
        total_nodes: 2
        total_cores: 160
        isa_tier: Tier1-aarch64

    sasquatch_nodes:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: sasquatch
        node_range: "sasquatch-[1-2]"
        count: 2
        hw_model: HPE RL300
        manufacturing_date: "2025-07-18"
        cpu_info:
          architecture: aarch64
          oci_coverage: broad
          model: Ampere Altra (Neoverse-N1)
          microarchitecture: Ares
          num_cpus: 1
          cores_per_cpu: 80
          max_frequency_ghz: 3.0
        ram_gib: 1024.0
        storage:
          - { label: disk0, capacity_tb: 1.6, type: SSD, interface: NVMe, model: "Samsung MO001600KYDMU", primary: true }
        network_interfaces:
          - { name: eth0/enp1s0f0np0, rate_gbps: 25.0, model: "Mellanox ConnectX-6 Lx", driver: mlx5_core, sriov_enabled: true, available_for_experiment: true }
          - { name: eth1/enP1p1s0f1np1, rate_gbps: 10.0, model: "Mellanox ConnectX-6 Lx", driver: mlx5_core, sriov_enabled: true, available_for_experiment: true }
        supported_image_platforms: [linux/arm64]
      requirements:
        - host: { node: cluster_sasquatch }

    # ── servan: 2 nodes, AMD EPYC 7352 + Xilinx Alveo U200 FPGA, exotic ─
    # Research-grade datacenter FPGA (not embedded SoC).
    # 2x 100 Gbps FPGA/Ethernet ports for FPGA-accelerated networking.
    cluster_servan:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: servan
        access_condition: exotic
        oar_queue: default
        date_of_arrival: "2021-12-15"
        manufacturing_date: "2021-12-10"
        total_nodes: 2
        total_cores: 96
        isa_tier: Tier1-x86_64

    servan_nodes:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: servan
        node_range: "servan-[1-2]"
        count: 2
        hw_model: Dell PowerEdge R7525
        manufacturing_date: "2021-12-10"
        cpu_info:
          architecture: x86_64
          model: AMD EPYC 7352
          microarchitecture: Zen 2
          num_cpus: 2
          cores_per_cpu: 24
          max_frequency_ghz: 2.30
        ram_gib: 128.0
        storage:
          - { label: disk0, capacity_tb: 1.6, type: SSD, interface: NVMe, model: "Dell Ent NVMe v2 AGN MU 1.6TB", primary: true }
          - { label: disk1, capacity_tb: 1.6, type: SSD, interface: NVMe, model: "Dell Ent NVMe v2 AGN MU 1.6TB" }
        network_interfaces:
          - { name: eth0/eno33, rate_gbps: 25.0, model: "Intel E810-C for SFP", driver: ice, available_for_experiment: true }
          - { name: eth1/eno34, rate_gbps: 10.0, model: "Intel E810-C for SFP", driver: ice, available_for_experiment: true }
          - { name: eth2/eno35, rate_gbps: 10.0, model: "Intel E810-C for SFP", driver: ice, available_for_experiment: true }
          - { name: fpga0, rate_gbps: 100.0, type: FPGA-Ethernet, model: "Xilinx Alveo U200 QSFP28", available_for_experiment: true }
          - { name: fpga1, rate_gbps: 100.0, type: FPGA-Ethernet, model: "Xilinx Alveo U200 QSFP28", available_for_experiment: true }
        fpga:
          model: Xilinx Alveo U200 XDMA Platform
          vendor: Xilinx/AMD
          shell: XDMA Platform
          link_gbps: 100.0
          count: 2
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_servan }

    # ── troll: 4 nodes, Cascade Lake + 1.5 TiB PMEM per node, exotic ───
    # Persistent Memory (Intel Optane DCPMM): byte-addressable NVDIMM.
    # 384 GiB DRAM + 1.5 TiB PMEM = 1.875 TiB total addressable memory/node.
    cluster_troll:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: troll
        access_condition: exotic
        oar_queue: default
        date_of_arrival: "2019-12-23"
        manufacturing_date: "2019-11-21"
        total_nodes: 4
        total_cores: 128
        isa_tier: Tier1-x86_64

    troll_nodes:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: troll
        node_range: "troll-[1-4]"
        count: 4
        hw_model: Dell PowerEdge R640
        manufacturing_date: "2019-11-21"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon Gold 5218
          microarchitecture: Cascade Lake-SP
          num_cpus: 2
          cores_per_cpu: 16
          max_frequency_ghz: 2.30
        ram_gib: 384.0
        pmem:
          capacity_tib: 1.5
          model: Intel Optane DCPMM
          per_node_tib: 1.5
        storage:
          - { label: disk0, capacity_tb: 0.48, type: SSD, interface: SATA, model: "Micron MTFDDAK480TDN", primary: true }
          - { label: disk1, capacity_tb: 1.6,  type: SSD, interface: NVMe, model: "Dell Samsung PM1735" }
        network_interfaces:
          - { name: eth0/eno1, rate_gbps: 25.0, model: "Mellanox ConnectX-4 Lx", driver: mlx5_core, sriov_enabled: true, available_for_experiment: true }
          - { name: eth1/eno2, rate_gbps: 25.0, model: "Mellanox ConnectX-4 Lx", driver: mlx5_core, sriov_enabled: true, available_for_experiment: true }
          - { name: ib0, rate_gbps: 100.0, type: InfiniBand, model: "Mellanox ConnectX-4", driver: mlx5_core, available_for_experiment: true }
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_troll }

    # ── yeti: 4 nodes, 4-socket Skylake-SP, 768 GiB, exotic ────────────
    # 4 CPU sockets per node — very high memory capacity (768 GiB).
    # 3 sub-groups (disk count/model differences).
    cluster_yeti:
      type: g5k.nodes.Cluster
      properties:
        cluster_name: yeti
        access_condition: exotic
        oar_queue: default
        date_of_arrival: "2018-01-16"
        manufacturing_date: "2017-12-26"
        total_nodes: 4
        total_cores: 256
        isa_tier: Tier1-x86_64

    yeti_node_1:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: yeti-1
        node_range: "yeti-1"
        count: 1
        hw_model: Dell PowerEdge R940
        manufacturing_date: "2017-12-26"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon Gold 6130
          microarchitecture: Skylake-SP
          num_cpus: 4
          cores_per_cpu: 16
          max_frequency_ghz: 2.10
        ram_gib: 768.0
        storage:
          - { label: disk0, capacity_tb: 0.48, type: SSD, interface: SATA, model: "Intel SSDSC2KG480G7R", primary: true }
          - { label: disk1, capacity_tb: 2.0,  type: HDD, interface: SAS, model: "Seagate ST2000NX0463", reservable: true }
          - { label: disk2, capacity_tb: 2.0,  type: HDD, interface: SAS, model: "Seagate ST2000NX0463", reservable: true }
          - { label: disk3, capacity_tb: 2.0,  type: HDD, interface: SAS, model: "Seagate ST2000NX0463", reservable: true }
          - { label: disk4, capacity_tb: 1.6,  type: SSD, interface: NVMe, model: "Dell NVMe PM1725 1.6TB" }
        network_interfaces:
          - { name: eth0/eno1, rate_gbps: 10.0, model: "Intel X710", driver: i40e, available_for_experiment: true }
          - { name: ib0, rate_gbps: 100.0, type: OmniPath, model: "Intel OPA HFI Silicon 100", driver: hfi1, available_for_experiment: true }
        supported_image_platforms: [linux/amd64]
      requirements:
        - host: { node: cluster_yeti }

    yeti_nodes_24:
      type: g5k.nodes.ComputeNode
      properties:
        node_name: yeti
        node_range: "yeti-[2,4]"
        count: 2
        hw_model: Dell PowerEdge R940
        manufacturing_date: "2017-12-26"
        cpu_info:
          architecture: x86_64
          model: Intel Xeon Gold 6130
          microarchitecture: Skylake-SP
          num_cpus: 4
          cores_per_cpu: 16
          max_frequency_ghz: 2.10
